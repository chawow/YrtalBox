
name: Test Vinted YrtalBox

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-vinted:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tester la connexion Vinted
        run: python scripts/sync_vinted.py
